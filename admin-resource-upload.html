<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Upload resource</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header><span class="logo">Admin panel</span><a href="admin-dashboard.html" style="margin-left:auto;">Back</a>
  </header>
  <div class="container">
    <form id="resource-form" onsubmit="return false;">
      <h3 style="margin-top:0;">Upload resource</h3>
      <p style="font-size:12px;color:#777;margin:2px 0 12px;">Files are tagged by category and batch so students can
        filter and find them later.</p>
      <label>File title</label>
      <input type="text" id="res-title">
      <label>Category</label>
      <select id="res-category">
        <option>Lecture notes</option>
        <option>Books</option>
        <option>Slides</option>
        <option>Previous questions</option>
      </select>
      <label>Batch number</label>
      <input type="text" id="res-batch">
      <label>Upload file</label>
      <input type="file">
      <p id="resource-error" class="error"></p>
      <button type="button" id="resource-upload-btn" style="width:100%;">Upload</button>
    </form>

    <p class="section-title" style="margin-top:24px;">Uploaded resources</p>
    <table>
      <tr>
        <th>File title</th>
        <th>Category</th>
        <th>Batch</th>
        <th>Actions</th>
      </tr>
      <tbody id="resource-table-body"></tbody>
    </table>
  </div>
  <script src="script.js"></script>
  <script>requireLogin();</script>
</body>

</html>
