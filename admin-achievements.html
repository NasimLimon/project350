<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Achievements</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header><span class="logo">Admin panel</span><a href="admin-dashboard.html" style="margin-left:auto;">Back</a>
  </header>
  <div class="container">
    <form id="achievement-form" onsubmit="return false;" style="max-width:420px;">
      <h3 style="margin-top:0;">Add achievement</h3>
      <p style="font-size:12px;color:#777;margin:2px 0 12px;">Records shown here update the public Achievements page
        immediately.</p>
      <label>Student name</label>
      <input type="text" id="ach-name">
      <label>Achievement title</label>
      <input type="text" id="ach-title">
      <label>Achievement description</label>
      <textarea id="ach-desc" rows="3"></textarea>
      <label>Achievement photo</label>
      <input type="file" id="ach-photo" accept="image/*">
      <img id="ach-photo-preview" style="display:none; width:80px; height:80px; object-fit:cover; border-radius:6px; margin-top:8px;">
      <p id="achievement-error" class="error"></p>
      <button type="button" id="achievement-save-btn" style="width:100%;">Save</button>
    </form>

    <p class="section-title" style="margin-top:24px;">Current achievements</p>
    <table>
      <tr>
        <th>Name</th>
        <th>Achievement</th>
        <th>Actions</th>
      </tr>
      <tbody id="achievement-table-body"></tbody>
    </table>
  </div>
  <script src="script.js"></script>
  <script>requireLogin();</script>
</body>

</html>
