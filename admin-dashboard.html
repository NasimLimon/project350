<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Admin dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header><span class="logo">Admin panel</span><a href="#" id="logout-btn" style="margin-left:auto;">Logout</a></header>
  <div class="container">
    <div class="admin-layout">
      <div class="sidebar">
        <div><a href="admin-dashboard.html?type=Notice" class="tab-link" data-type="Notice">Notices</a></div>
        <div><a href="admin-dashboard.html?type=Event" class="tab-link" data-type="Event">Events</a></div>
        <div><a href="admin-dashboard.html?type=Job" class="tab-link" data-type="Job">Jobs</a></div>
        <div><a href="admin-resource-upload.html">Resources</a></div>
        <div><a href="admin-gallery.html">Gallery</a></div>
        <div><a href="admin-achievements.html">Achievements</a></div>
        <div><a href="admin-committee.html">Committee</a></div>
      </div>
      <div class="admin-main">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <strong id="dashboard-title">Manage notices</strong>
          <a id="add-new-link" href="admin-form.html"><button type="button">Add new</button></a>
        </div>
        <p style="font-size:12px;color:#777;margin:2px 0 12px;">Publishing a new entry here immediately moves it to the
          top of the public feed.</p>
        <table>
          <tr>
            <th>Title</th>
            <th>Date</th>
            <th>Company</th>
            <th>Actions</th>
          </tr>
          <tbody id="content-table-body"></tbody>
        </table>
        <table id="content-table" style="display:none;"></table>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
  <script>requireLogin();</script>
</body>

</html>
